<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG ассистент</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">RAG ассистент по базе знаний</header>
    <div id="messages" class="messages"></div>
    <form id="chat-form" class="input-row">
      <textarea id="message-input" placeholder="Задайте вопрос..." rows="1" required></textarea>
      <button id="send-btn" type="submit">Отправить</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
